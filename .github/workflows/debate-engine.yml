name: Debate Engine

on:
  push:
    paths:
      - "debate-engine/**"
      - ".github/workflows/debate-engine.yml"
  pull_request:
    paths:
      - "debate-engine/**"
      - ".github/workflows/debate-engine.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: debate-engine/package.json
      - run: npm install --ignore-scripts
      - run: npm run typecheck
