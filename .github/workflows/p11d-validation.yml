name: P1.1-D focused validation (retry)

on:
  pull_request:
    branches:
      - feature/autonomous-organization-v1
    paths:
      - .github/workflows/p11d-validation.yml
      - debate-engine/src/coo-platform.ts
      - debate-engine/supabase/migrations/**
      - debate-engine/test/**
      - debate-engine/package.json
      - debate-engine/package-lock.json

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and full test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: debate-engine/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
