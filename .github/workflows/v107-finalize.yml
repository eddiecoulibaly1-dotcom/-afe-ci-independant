name: AFE-CI V1.0.7 finalize

on:
  push:
    branches: [main]
    paths:
      - 'debate-engine/src/providers.ts'
      - 'debate-engine/package.json'
      - '.github/workflows/v107-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Finalize server metadata and CSP
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/server.ts')
          s = p.read_text()
          s = s.replace('const VERSION="1.0.6"', 'const VERSION="1.0.7"')
          s = re.sub(r"(?:connect-src 'self' https://\\*\\.supabase\\.co wss://\\*\\.supabase\\.co;\\s*)+", "connect-src 'self' https://*.supabase.co wss://*.supabase.co; ", s)
          if 'v1_0_7:true' not in s:
              s = s.replace('v1_0_6:true,', 'v1_0_6:true,v1_0_7:true,')
          p.write_text(s)
      - name: Typecheck
        run: npm install && npm run typecheck
      - name: Remove one-time finalizer and commit
        working-directory: .
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v107-finalize.yml
          git add debate-engine/src/server.ts debate-engine/package-lock.json debate-engine/package.json
          git commit -m 'fix(debate-engine): finalize V1.0.7 production hardening'
          git push origin main
