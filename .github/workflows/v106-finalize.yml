name: AFE-CI V1.0.6 finalize

on:
  push:
    branches: [main]
    paths:
      - 'debate-engine/src/lab-v106.ts'
      - 'debate-engine/src/auth.ts'
      - 'debate-engine/src/providers.ts'
      - 'debate-engine/src/workspace-store.ts'
      - '.github/workflows/v106-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wire V1.0.6 server
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          s = s.replace('from "./lab-v10.js"', 'from "./lab-v106.js"')
          s = s.replace("script-src 'unsafe-inline';", "script-src 'unsafe-inline' https://cdn.jsdelivr.net;")
          s = s.replace("script-src 'unsafe-inline' https://cdn.jsdelivr.net;", "script-src 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co;")
          s = s.replace('const VERSION="1.0.5"', 'const VERSION="1.0.6"')
          p.write_text(s)

      - name: Align Supabase server key naming
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/workspace-store.ts')
          s = p.read_text()
          s = s.replace('const serviceRoleKey=process.env.SUPABASE_SERVICE_ROLE_KEY;', 'const secretKey=process.env.SUPABASE_SECRET_KEY??process.env.SUPABASE_SERVICE_ROLE_KEY;')
          s = s.replace('if(!url||!serviceRoleKey) return null;', 'if(!url||!secretKey) return null;')
          s = s.replace('return {url,serviceRoleKey};', 'return {url,secretKey};')
          s = s.replace('apikey:c.config.serviceRoleKey', 'apikey:c.config.secretKey')
          s = s.replace('Authorization:`Bearer ${config.serviceRoleKey}`', 'Authorization:`Bearer ${config.secretKey}`')
          s = s.replace('apikey:config.serviceRoleKey', 'apikey:config.secretKey')
          p.write_text(s)

      - name: Pin package version
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['version']='1.0.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

      - name: Install and typecheck
        run: npm install && npm run typecheck

      - name: Commit generated lockfile and finalized sources
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debate-engine/src/server.ts debate-engine/src/workspace-store.ts debate-engine/package.json debate-engine/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(debate-engine): finalize V1.0.6 realtime, security and metadata'
          git push origin main

# V1.0.6 finalization: wire realtime client, PWA cache migration, CSP connectivity, secret-key compatibility, and server metadata.
