name: AFE-CI V1.0.6 finalize

on:
  push:
    branches: [main]
    paths:
      - 'debate-engine/src/lab-v106.ts'
      - 'debate-engine/src/auth.ts'
      - 'debate-engine/src/providers.ts'
      - '.github/workflows/v106-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: debate-engine
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wire V1.0.6 server
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          s = s.replace('from "./lab-v10.js"', 'from "./lab-v106.js"')
          s = s.replace("script-src 'unsafe-inline';", "script-src 'unsafe-inline' https://cdn.jsdelivr.net;")
          s = s.replace('const VERSION="1.0.5"', 'const VERSION="1.0.6"')
          p.write_text(s)

      - name: Pin package version
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['version']='1.0.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

      - name: Improve provider diagnostics
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/providers.ts')
          s=p.read_text()
          s=s.replace('  const response = await client.responses.create({', '  try {\n    const response = await client.responses.create({')
          s=s.replace('  });\n  return JSON.parse(response.output_text) as T;\n}\n\nasync function callGemini', '    });\n    return JSON.parse(response.output_text) as T;\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    throw new Error(`OpenAI ${args.model}: ${message}`);\n  }\n}\n\nasync function callGemini', 1)
          s=s.replace('  const interaction = await ai.interactions.create({', '  try {\n    const interaction = await ai.interactions.create({')
          s=s.replace('  });\n  if (!interaction.output_text) throw new Error("Gemini returned no output_text");\n  return JSON.parse(interaction.output_text) as T;\n}', '    });\n    if (!interaction.output_text) throw new Error("Gemini returned no output_text");\n    return JSON.parse(interaction.output_text) as T;\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    throw new Error(`Gemini ${args.model}: ${message}`);\n  }\n}', 1)
          p.write_text(s)

      - name: Install and typecheck
        run: npm install && npm run typecheck

      - name: Commit generated lockfile and finalized sources
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debate-engine/src/server.ts debate-engine/src/providers.ts debate-engine/package.json debate-engine/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(debate-engine): finalize V1.0.6 realtime and diagnostics'
          git push origin main

# V1.0.6 finalization: wire realtime client, PWA cache migration, diagnostics, and server metadata.
