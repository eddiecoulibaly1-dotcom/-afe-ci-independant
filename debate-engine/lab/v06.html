<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><link rel="manifest" href="/lab/manifest.webmanifest"><title>AFE-CI · Debate Engine</title>
<style>
:root{--bg:#07101d;--card:#0d1828;--line:#20324a;--text:#edf4ff;--muted:#8ea1bb;--ok:#62d9a4;--bad:#ff7b8a;--blue:#75a9ff;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px 14px 50px}.top{padding:10px 2px 16px}.eyebrow{color:var(--ok);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:28px;font-weight:900;margin:3px 0}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.sticky{position:sticky;top:10px}.label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.input,.ta{width:100%;border:1px solid var(--line);background:#081321;color:var(--text);border-radius:11px;padding:11px;font:inherit}.ta{min-height:135px;resize:vertical}.btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:11px;background:var(--ok);color:#04130c;font-weight:900}.btn:disabled{opacity:.5}.status{display:inline-block;border-radius:999px;padding:5px 8px;background:#101f33;color:var(--muted);font-size:11px}.q{font-size:19px;font-weight:800;line-height:1.3}.round{border:1px solid var(--line);border-radius:13px;margin-top:12px;overflow:hidden}.rh{padding:10px 12px;background:#0c1929;display:flex;justify-content:space-between;font-weight:800}.rb{padding:12px}.actor{border-left:3px solid var(--line);padding-left:10px;margin:12px 0}.arch{border-color:var(--blue)}.red{border-color:var(--bad)}.judge{border-color:var(--ok)}.evidence{border-color:var(--warn)}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:8px;margin:2px;font-size:11px}.final{border-color:rgba(98,217,164,.4);background:rgba(98,217,164,.05)}.error{color:var(--bad);font-size:12px;margin-top:8px}.history button{display:block;width:100%;text-align:left;background:#081321;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;margin:6px 0}.empty{text-align:center;color:var(--muted);padding:20px}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.score{background:#081321;border:1px solid var(--line);padding:7px;border-radius:8px;font-size:11px}.bar{height:5px;background:#20324a;border-radius:5px;margin-top:4px}.fill{height:100%;background:var(--ok);border-radius:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.sticky{position:static}.title{font-size:25px}.scoregrid{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="wrap"><header class="top"><div class="eyebrow">AFE-CI · V0.6</div><div class="title">Debate Engine</div><div class="sub">Un seul cockpit mobile. OpenAI construit, Gemini attaque, l'Evidence Engine vérifie, l'Arbiter tranche.</div></header><div class="grid"><aside><div class="card sticky"><b>Nouveau débat</b><label class="label">Question stratégique</label><textarea id="q" class="ta" placeholder="Quelle décision devons-nous prendre ?"></textarea><label class="label">Contexte</label><textarea id="c" class="ta" style="min-height:85px" placeholder="Contraintes, données, cible…"></textarea><button id="go" class="btn">Lancer le débat</button><div id="err" class="error"></div></div><div class="card"><b>Historique</b><div id="hist" class="history empty">Chargement…</div></div></aside><main id="app"><div class="card empty">Prêt. Lance une question stratégique.</div></main></div></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]),arr=x=>Array.isArray(x)?x:[],safeObj=x=>x&&typeof x==='object'?x:{};
const dims={buyerValue:['Valeur acheteur',15],sellerValue:['Valeur vendeur',15],coteDIvoireFit:["Fit Côte d’Ivoire",15],marketplaceLiquidity:['Liquidité',15],differentiation:['Différenciation',10],trustFraud:['Confiance',10],technicalFeasibility:['Faisabilité',10],acquisition:['Acquisition',5],monetization:['Monétisation',5]};
function scorecard(s){if(!s)return '';return '<div class="scoregrid">'+Object.entries(dims).map(([k,v])=>{let n=Number(s[k]??0);return `<div class="score"><b>${v[0]}</b><br>${n.toFixed(0)}/100<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,n))}%"></div></div></div>`}).join('')+'</div>'}
function evidence(e){e=safeObj(e);let records=arr(e.records||e.audit?.records);return `<div class="actor evidence"><b>🔎 Evidence Engine</b><p><span class="pill">Confiance ${((Number(e.confidence??e.audit?.confidence??0))*100).toFixed(0)}%</span><span class="pill">${e.blocking??e.audit?.blocking?'BLOCKING':'NON-BLOCKING'}</span></p>${records.length?'<ul>'+records.slice(0,12).map(r=>`<li><b>${esc(r.classification||r.type||'CLAIM')}</b> — ${esc(r.status||'unknown')} · ${esc(r.rationale||r.source||'')}</li>`).join('')+'</ul>':'<span class="muted">Aucun détail d’évidence renvoyé.</span>'}</div>`}
function render(d){let f=safeObj(d.finalDecision);$('app').innerHTML=`<div class="card"><div class="q">${esc(d.question)}</div><p class="muted">${esc(d.context||'')}</p><span class="status">${esc(d.status)} · ${arr(d.rounds).length} round(s)</span>${f.decision?`<div class="card final"><b>Décision ${d.status==='converged'?'finale':'à valider'}</b><h2>${esc(f.decision)}</h2><span class="pill">Architecte ${esc(f.architectScore)}/100</span><span class="pill">Red Team ${esc(f.redTeamScore)}/100</span>${scorecard(f.architectScorecard)}</div>`:''}${arr(d.rounds).map(r=>{let a=safeObj(r.architect),rt=safeObj(r.redTeam),j=safeObj(r.judge);return `<div class="round"><div class="rh"><span>Round ${esc(r.round)}</span><span class="muted">${esc(j.status||'')}</span></div><div class="rb"><div class="actor arch"><b>🧠 Architecte</b><p>${esc(a.position)}</p></div><div class="actor red"><b>⚔️ Red Team</b><p>${esc(rt.verdict)}</p><ul>${arr(rt.attacks).map(x=>`<li><b>${esc(x.severity)}</b> — ${esc(x.argument)}</li>`).join('')}</ul></div>${evidence(r.evidence||j.evidence||r.evidenceAudit||d.evidence)}<div class="actor judge"><b>⚖️ Arbiter</b><p>${esc(j.decision)}</p><span class="pill">Architecte ${esc(j.architectScore)}/100</span><span class="pill">Red Team ${esc(j.redTeamScore)}/100</span>${arr(j.criticalDisagreements).length?'<p><b>Désaccords critiques</b></p><ul>'+j.criticalDisagreements.map(esc).map(x=>`<li>${x}</li>`).join('')+'</ul>':''}${j.nextRoundObjective?`<p class="muted"><b>Prochain test :</b> ${esc(j.nextRoundObjective)}</p>`:''}</div></div></div>`}).join('')}</div>`}
async function loadHistory(){let r=await fetch('/debates');if(!r.ok)throw Error('Historique indisponible');let ds=await r.json();$('hist').className='history';$('hist').innerHTML=ds.length?ds.map(d=>`<button data-id="${esc(d.id)}">${esc(d.question)}<br><small class="muted">${esc(d.status)} · ${arr(d.rounds).length} round(s)</small></button>`).join(''):'<div class="empty">Aucun débat.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let r=await fetch('/debates/'+encodeURIComponent(b.dataset.id));render(await r.json())})}
$('go').onclick=async()=>{let q=$('q').value.trim();if(!q){$('err').textContent='Question requise.';return}$('go').disabled=true;$('go').textContent='Débat en cours…';$('err').textContent='';try{let r=await fetch('/debates/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:$('c').value.trim()})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');render(d);await loadHistory()}catch(e){$('err').textContent=e.message}finally{$('go').disabled=false;$('go').textContent='Lancer le débat'}};loadHistory().catch(e=>$('err').textContent=e.message);
</script></body></html>
