<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFE-CI · Debate Lab V0.4</title>
<style>body{margin:0;background:#07101d;color:#edf4ff;font:15px system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.card{background:#0d1828;border:1px solid #20324a;border-radius:16px;padding:16px;margin-bottom:16px}textarea{width:100%;box-sizing:border-box;background:#081321;color:#fff;border:1px solid #20324a;border-radius:10px;padding:10px;min-height:120px}.ctx{min-height:70px}button{background:#62d9a4;border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;margin-top:10px}.muted{color:#8ea1bb}.q{font-size:22px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#101f33;margin:4px;font-size:12px}.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}@media(max-width:650px){.scoregrid{grid-template-columns:1fr 1fr}}.dim{background:#081321;border:1px solid #20324a;border-radius:9px;padding:8px}.bar{height:6px;background:#20324a;border-radius:5px;margin-top:5px}.fill{height:100%;background:#62d9a4;border-radius:5px}.round{border-left:3px solid #75a9ff;padding-left:12px;margin:14px 0}.attack{border-left:3px solid #ff7b8a;padding-left:10px;margin:7px 0}.judge{border-left:3px solid #62d9a4;padding-left:10px}.history button{display:block;width:100%;text-align:left;background:#081321;color:#fff;border:1px solid #20324a;margin:6px 0}.error{color:#ff7b8a}.final{border-color:#62d9a4}.next{background:#161a18;padding:10px;border-radius:9px}</style></head>
<body><div class="wrap"><h1>AFE-CI · Debate Lab <small>V0.4</small></h1><p class="muted">Decision Intelligence : score pondéré déterministe, objections critiques et convergence contrôlée.</p><div class="grid"><aside><div class="card"><h3>Nouveau débat</h3><textarea id="q" placeholder="Quelle décision stratégique devons-nous prendre ?"></textarea><textarea id="c" class="ctx" placeholder="Contexte optionnel"></textarea><button id="go">Lancer</button><p id="err" class="error"></p></div><div class="card history"><h3>Historique</h3><div id="hist" class="muted">Chargement…</div></div></aside><main id="app"><div class="card muted">Prêt.</div></main></div></div>
<script>
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])), dims={buyerValue:['Valeur acheteur',15],sellerValue:['Valeur vendeur',15],coteDIvoireFit:["Fit Côte d’Ivoire",15],marketplaceLiquidity:['Liquidité marketplace',15],differentiation:['Différenciation',10],trustFraud:['Confiance / fraude',10],technicalFeasibility:['Faisabilité technique',10],acquisition:['Acquisition',5],monetization:['Monétisation',5]};
function scorecard(s){if(!s)return '';return '<div class="scoregrid">'+Object.entries(dims).map(([k,[n,w]])=>`<div class="dim"><b>${n}</b><br>${Number(s[k]||0).toFixed(0)}/100 · ${w}%<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(s[k]||0)))}%"></div></div></div>`).join('')+'</div>'}
function render(d){let f=d.finalDecision; $('app').innerHTML=`<div class="card"><div class="q">${esc(d.question)}</div><p class="muted">${esc(d.context||'')}</p><span class="pill">${esc(d.status)}</span><span class="pill">${d.rounds.length} round(s)</span>${f?`<div class="card final"><b>Décision ${d.status==='converged'?'finale':'à valider'}</b><h2>${esc(f.decision)}</h2><span class="pill">Architecte ${f.architectScore}/100</span><span class="pill">Red Team ${f.redTeamScore}/100</span><h3>Scorecard finale</h3>${scorecard(f.architectScorecard)}<p class="muted">${(f.rationale||[]).map(esc).join(' · ')}</p></div>`:''}${(d.rounds||[]).map(r=>`<div class="round"><h3>Round ${r.round}</h3><p><b>🧠 Architecte</b><br>${esc(r.architect.position)}</p><p><b>⚔️ Red Team</b> · ${esc(r.redTeam.verdict)}</p>${(r.redTeam.attacks||[]).map(a=>`<div class="attack"><b>${esc(a.severity)}</b> — ${esc(a.argument)}</div>`).join('')}<div class="judge"><p><b>⚖️ Arbitre</b> · ${esc(r.judge.status)}</p><p>${esc(r.judge.decision)}</p><span class="pill">Architecte ${r.judge.architectScore}</span><span class="pill">Red Team ${r.judge.redTeamScore}</span><h4>Scorecard Architecte</h4>${scorecard(r.judge.architectScorecard)}${r.judge.criticalDisagreements?.length?`<p><b>Désaccords critiques</b> : ${r.judge.criticalDisagreements.map(esc).join(' · ')}</p>`:''}${r.judge.nextRoundObjective?`<div class="next"><b>Prochain objectif :</b> ${esc(r.judge.nextRoundObjective)}</div>`:''}</div></div>`).join('')}</div>`}
async function history(){let r=await fetch('/debates');if(!r.ok)throw Error('Historique indisponible');let ds=await r.json();$('hist').innerHTML=ds.length?ds.map(d=>`<button data-id="${esc(d.id)}">${esc(d.question)}<br><small>${esc(d.status)} · ${d.rounds.length} round(s)</small></button>`).join(''):'Aucun débat';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let r=await fetch('/debates/'+b.dataset.id);render(await r.json())})}
$('go').onclick=async()=>{let q=$('q').value.trim();if(!q){$('err').textContent='Question requise';return} $('go').disabled=true;$('go').textContent='Débat en cours…';$('err').textContent='';try{let r=await fetch('/debates/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:$('c').value.trim()})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');render(d);await history()}catch(e){$('err').textContent=e.message}finally{$('go').disabled=false;$('go').textContent='Lancer'}};history().catch(e=>$('err').textContent=e.message);
</script></body></html>
