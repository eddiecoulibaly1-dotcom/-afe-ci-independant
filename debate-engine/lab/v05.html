<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>AFE-CI · Debate Lab V0.5</title>
<style>
:root{--bg:#07101d;--panel:#0d1828;--line:#20324a;--text:#edf4ff;--muted:#8ea1bb;--ok:#62d9a4;--warn:#ffd166;--bad:#ff7b8a;--blue:#75a9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}@media(max-width:820px){.grid{grid-template-columns:1fr}}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.sticky{position:sticky;top:12px}@media(max-width:820px){.sticky{position:static}}textarea{width:100%;background:#081321;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:130px;resize:vertical}button{width:100%;background:var(--ok);border:0;border-radius:10px;padding:12px;font-weight:900;margin-top:10px}button:disabled{opacity:.5}.muted{color:var(--muted)}.title{font-size:28px;font-weight:900}.badge,.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:3px;font-size:11px}.round{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px}.actor{border-left:3px solid var(--line);padding-left:10px;margin:10px 0}.architect{border-color:var(--blue)}.red{border-color:var(--bad)}.judge{border-color:var(--ok)}.evidence{border-color:var(--warn)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.next{background:#151914;border:1px solid #3c4126;border-radius:9px;padding:9px;margin-top:8px}.item{background:#081321;color:var(--text);border:1px solid var(--line);text-align:left;margin:5px 0}.item small{color:var(--muted)}h1,h2,h3{line-height:1.2}.error{color:var(--bad)}ul{padding-left:20px}
</style></head><body><div class="wrap"><header><div class="title">AFE-CI · Debate Lab <span class="badge">V0.5 Evidence Engine</span></div><p class="muted">Une question → Architecte → Red Team → audit des preuves → Arbiter → score déterministe → nouveau round si nécessaire.</p></header><div class="grid"><aside><div class="card sticky"><h3>Nouveau débat</h3><textarea id="q" placeholder="Quelle décision stratégique devons-nous prendre ?"></textarea><textarea id="c" placeholder="Contexte optionnel" style="min-height:80px;margin-top:8px"></textarea><button id="go">Lancer le débat</button><p id="err" class="error"></p></div><div class="card"><h3>Historique</h3><div id="hist" class="muted">Chargement…</div></div></aside><main id="app"><div class="card muted">Prêt.</div></main></div></div>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function evidence(a){if(!a)return '';const cls=a.blocking?'bad':'ok';return `<div class="actor evidence"><h3>🔎 Evidence Engine</h3><p class="${cls}"><b>${a.blocking?'BLOCKING':'NON-BLOCKING'}</b> · confiance ${(Number(a.confidence||0)*100).toFixed(0)}%</p><p>${a.records?.length||0} claim(s) audité(s).</p>${a.records?.length?'<ul>'+a.records.map(r=>`<li><b>${esc(r.claimId)}</b> · ${esc(r.classification)} · <span class="${r.status==='unsupported'?'bad':'ok'}">${esc(r.status)}</span> — ${esc(r.rationale)}</li>`).join('')+'</ul>':''}${a.nextTests?.length?`<div class="next"><b>Tests requis :</b><ul>${a.nextTests.map(esc).map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}</div>`}
function render(d){const f=d.finalDecision;document.getElementById('app').innerHTML=`<div class="card"><h2>${esc(d.question)}</h2><p class="muted">${esc(d.context||'')}</p><span class="pill">${esc(d.status)}</span><span class="pill">${d.rounds.length} round(s)</span>${f?`<div class="card"><b>Décision ${d.status==='converged'?'finale':'non résolue'}</b><h2>${esc(f.decision)}</h2><span class="pill">Architecte ${f.architectScore}/100</span><span class="pill">Red Team ${f.redTeamScore}/100</span>${evidence(f.evidenceAudit)}<p class="muted">${(f.rationale||[]).map(esc).join(' · ')}</p></div>`:''}${(d.rounds||[]).map(r=>`<section class="round"><h3>Round ${r.round}</h3><div class="actor architect"><h3>🧠 Architecte</h3><p><b>${esc(r.architect.position)}</b></p><p class="muted">Claims : ${r.architect.claims?.length||0}</p></div>${evidence(r.evidenceAudit)}<div class="actor red"><h3>⚔️ Red Team · ${esc(r.redTeam.verdict)}</h3><ul>${(r.redTeam.attacks||[]).map(a=>`<li><b>${esc(a.severity)}</b> — ${esc(a.argument)}</li>`).join('')}</ul></div><div class="actor judge"><h3>⚖️ Arbiter · ${esc(r.judge.status)}</h3><p>${esc(r.judge.decision)}</p><span class="pill">Architecte ${r.judge.architectScore}</span><span class="pill">Red Team ${r.judge.redTeamScore}</span>${r.judge.criticalDisagreements?.length?`<p class="bad"><b>Désaccords :</b> ${r.judge.criticalDisagreements.map(esc).join(' · ')}</p>`:''}${r.judge.nextRoundObjective?`<div class="next"><b>Prochain objectif :</b> ${esc(r.judge.nextRoundObjective)}</div>`:''}</div></section>`).join('')}</div>`}
async function history(){const r=await fetch('/debates');if(!r.ok)throw Error('Historique indisponible');const ds=await r.json();$('hist').innerHTML=ds.length?ds.map(d=>`<button class="item" data-id="${esc(d.id)}">${esc(d.question)}<br><small>${esc(d.status)} · ${d.rounds.length} round(s)</small></button>`).join(''):'Aucun débat';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const r=await fetch('/debates/'+b.dataset.id);render(await r.json())})}
$('go').onclick=async()=>{const q=$('q').value.trim();if(!q){$('err').textContent='Question requise';return}$('go').disabled=true;$('go').textContent='Débat en cours…';$('err').textContent='';try{const r=await fetch('/debates/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,context:$('c').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');render(d);await history()}catch(e){$('err').textContent=e.message}finally{$('go').disabled=false;$('go').textContent='Lancer le débat'}};history().catch(e=>$('err').textContent=e.message);
</script></body></html>
